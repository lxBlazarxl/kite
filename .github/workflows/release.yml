name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (test builds only; real releases come from tags)
        default: v0.0.0-dev

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: scripts/release-build.sh "$VERSION"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Hub image
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: deploy/Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kite-hub:${{ env.VERSION }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/kite-hub:latest', github.repository_owner) || '' }}

      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: internal/agentdl/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kite-agent:${{ env.VERSION }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/kite-agent:latest', github.repository_owner) || '' }}

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes

      - name: Keep test build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kite-${{ env.VERSION }}
          path: dist/
